name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CourtBook.slnx

      - name: Build
        run: dotnet build CourtBook.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/CourtBook.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/CourtBook.IntegrationTests --no-build --configuration Release