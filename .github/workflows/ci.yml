name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CourtBook.slnx

      - name: Build
        run: dotnet build CourtBook.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/CourtBook.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/CourtBook.IntegrationTests --no-build --configuration Release
        
  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check readiness endpoint
        run: curl --fail http://localhost:8080/health/ready

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Stop containers
        if: always()
        run: docker compose down -v